name: deploy to helios
on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: ssh pull
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.HELIOS_KEY }}" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          ssh-keyscan -p 2222 helios.se.ifmo.ru >> ~/.ssh/known_hosts
          ssh -p 2222 s564064@helios.se.ifmo.ru \
            "cd ~/public_html && git pull -q origin main"